name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # `next build` must not query data or need secrets: the build phase skips DATABASE_URL and the provider secrets.
      AUTH_PROVIDER: neon-auth
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `turbo --affected` filters correctly
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test --affected
        env:
          # Live Neon test (apps/dashboard workspace.neon.test.ts): a disposable branch URL; empty skips it.
          NEON_TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
      # Separate step: `next build` and `tsc` both rewrite apps/*/.next/types, so running them together flakes.
      - run: pnpm turbo run build --affected
