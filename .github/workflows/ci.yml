name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders: the auth config is validated when routes are collected.
      AUTH_PROVIDER: backend
      API_BASE_URL: http://localhost:8000
      SESSION_SECRET: ci-only-placeholder-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `turbo --affected` filters correctly
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test build --affected
